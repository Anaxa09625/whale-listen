[project]
name = "whale-listen"
version = "0.1.0"
description = "Ears for AI — convert audio to structured note data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "onnxruntime>=1.16.0",
    "pretty-midi>=0.2.10",
    "scipy>=1.10.0",
    "librosa>=0.10.0",
    "fastmcp>=2.0.0",
]

[project.scripts]
whale-listen = "whale_listen:main"
whale-listen-mcp = "server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
